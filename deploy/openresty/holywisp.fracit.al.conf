# holywisp.fracit.al origin vhost (terp) — for abulxt's fracital_origin_apps ansible, NOT this repo.
#
# holywisp.fracit.al is the edges' keyed holyWisp relay and stomp depends on it
# (STOMP_WISP_URL=wss://holywisp.fracit.al/pipe/<WISP_GATE_KEY>/). To make terp the origin,
# abulxt adds holywisp.fracit.al to the edge forwarding (fracital_extra_hosts) and drops this
# block into the terp origin set (fracital_origin_apps). The /pipe/<WISP_GATE_KEY>/ gate stays
# at the edge and is forwarded to this backend at "/", so stomp's keyed URL keeps working
# unchanged — only the relay's backend moves from the edge-local holyWisp to terp:8082.
#
# Prereqs already present for stomp.fracit.al: the $ws_upgrade / $connection_upgrade maps and the
# origin TLS cert in the shared nginx.conf, plus this upstream in the http{} block:
#   upstream holywisp_app { server 127.0.0.1:8082; keepalive 64; }
# Replace <FRX_EDGE_TOKEN> with the real edge token (the same one the stomp block checks).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name holywisp.fracit.al;

    ssl_certificate /etc/fracital-edge/origin.crt;
    ssl_certificate_key /etc/fracital-edge/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fracital_tls:10m;

    client_max_body_size 100m;

    if ($http_x_frx_edge_token != "<FRX_EDGE_TOKEN>") {
        return 403;
    }

    location / {
        proxy_pass http://holywisp_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-FRX-Edge-Token "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
