name: Nightly

# Publish master to npm as holywisp@nightly, once a night and on manual dispatch. Only a commit
# whose Build passed is published, and only once: a night without a new commit publishes nothing.
#
# The version is node/package.json's with the UTC time and the commit as its prerelease, e.g.
# 0.5.2-nightly.202611110643.g1a2b3c4 (node/scripts/nightly-version.mjs). Nothing here bumps the
# number in package.json; a release does that by hand, to the next version right after tagging
# (0.5.2-nightly.* sorts below 0.5.2, so nightlies of a released number would read as older than
# the release). The binaries inside report the same string (`holywisp --version`), so a bug report
# names the nightly it came from.
#
# The run is for one commit, the head of master when it started (github.sha), and everything below
# uses that commit: it is the g<commit> of the version, what the jobs check out, and the commit the
# provenance names. A dispatch from any other branch is refused.
#
# The tarball is built once (`pack`), installed and run on every platform it carries a binary for
# (`smoke`, the same matrix as build.yml's), and that very file is what `publish` uploads. It goes
# out under the dist-tag `nightly`; `latest` belongs to tagged releases (release.yml).
#
# No secret: npm trusted publishing authenticates the `publish` job by its OIDC identity (the
# package's trusted publishers on npmjs.com name this repository and `nightly.yml`), and the
# package carries provenance. Only that job can ask for the identity, and it runs nothing from the
# repository: no checkout, no install, only `npm publish` of the tested tarball. The actions are
# pinned to commits for the same reason.
#
# GitHub switches a schedule off after 60 days without a commit to the repository; the Actions tab
# offers to switch it back on.
on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.build.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Only master is published
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/master ]; then
            echo "::error::nightlies are built from master, not $REF"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Version
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "version=$(node node/scripts/nightly-version.mjs)" | tee -a "$GITHUB_OUTPUT"

      # A package nobody has published yet is the one error that means "go on"; any other (the
      # registry is down) stops the run, so that a commit is never published twice.
      - name: Not published yet?
        id: fresh
        run: |
          set -euo pipefail
          commit=$(node node/scripts/nightly-version.mjs --commit)
          if ! versions=$(npm view holywisp versions --json 2>&1); then
            grep -q E404 <<<"$versions" || { echo "$versions"; exit 1; }
            versions=""
          fi
          if grep -q "\.$commit\"" <<<"$versions"; then
            echo "::notice::$commit is published already"
            echo "publish=false" | tee -a "$GITHUB_OUTPUT"
          else
            echo "publish=true" | tee -a "$GITHUB_OUTPUT"
          fi

      # Build (build.yml) must have passed on this commit: the C tests under the sanitizers on
      # three systems, clang-tidy, the wrapper's tests. It is waited for while it runs, up to 45
      # minutes; a query that fails counts as "not finished yet". A cancelled Build is fine only
      # when master has moved on (the newer push cancelled it, and its own nightly follows); on
      # the commit master still points at, somebody cancelled it or a job ran into its timeout,
      # and the night says so. A commit that has no run at all is the format bot's (a push made
      # with the workflow token starts no workflow): dispatch Build on master, then this.
      - name: Build passed on this commit
        id: build
        if: steps.fresh.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          missing=0
          for _ in $(seq 1 90); do
            run=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0] | "\(.status) \(.conclusion) \(.id)"') ||
              run="unknown null null"
            read -r status conclusion id <<<"$run"
            if [ "$status" = completed ]; then
              case "$conclusion" in
                success)
                  echo "publish=true" | tee -a "$GITHUB_OUTPUT"
                  ;;
                cancelled)
                  head=$(gh api "repos/$REPO/commits/master" --jq .sha)
                  if [ "$head" = "$SHA" ]; then
                    echo "::error::Build on $SHA was cancelled (run $id) and master has not moved"
                    exit 1
                  fi
                  echo "::notice::Build on $SHA was cancelled (run $id), overtaken by $head; nothing to publish"
                  echo "publish=false" | tee -a "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "::error::Build on $SHA: $conclusion (run $id)"
                  exit 1
                  ;;
              esac
              exit 0
            fi
            if [ "$status" = null ]; then
              missing=$((missing + 1))
              if [ "$missing" -ge 10 ]; then
                echo "::error::no Build run for $SHA; dispatch Build on master, then this workflow"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::Build on $SHA did not finish in 45 minutes"
          exit 1

  # The version goes into package.json first: build.mjs hands its prerelease part to the C build,
  # so the six binaries and the package agree on what they are.
  pack:
    name: Build the package
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      # The same zig as build.yml and release.yml.
      - name: Install toolchain
        env:
          ZIG_VERSION: "0.17.1"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pipx install "ziglang==$ZIG_VERSION"

      - name: Build and pack
        working-directory: node
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build.mjs
          file bin/*/holywisp*
          bin/linux-x64/holywisp --version
          test "$(bin/linux-x64/holywisp --version)" = "holywisp $VERSION"
          npm pack
          test -f "holywisp-$VERSION.tgz"
          tar -tzf "holywisp-$VERSION.tgz"

      - name: Test against the packaged binary
        working-directory: node
        run: node --test --test-timeout=30000 tests/*.test.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: holywisp-nightly
          path: node/holywisp-*.tgz
          if-no-files-found: error
          retention-days: 7

  # What a user gets: the tarball installed into an empty project, no toolchain. The same systems
  # as build.yml's node-smoke, for the same reasons (Alpine is the musl case; the macOS and Windows
  # binaries were cross-compiled on Linux and run here for the first time).
  smoke:
    name: nightly on ${{ matrix.name }}
    needs: [gate, pack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'sh' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: alpine
            runner: ubuntu-latest
            container: node:24-alpine
          - name: darwin-arm64
            runner: macos-latest
          - name: darwin-x64
            runner: macos-15-intel
          - name: win32-x64
            runner: windows-latest
            shell: bash
          - name: win32-arm64
            runner: windows-11-arm
            shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: ${{ !matrix.container }}
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: holywisp-nightly

      - name: Install the tarball and run it
        run: |
          set -eu
          dir=$(mktemp -d)
          cp node/scripts/smoke-package.mjs "holywisp-$VERSION.tgz" "$dir/"
          cd "$dir"
          npm init -y > /dev/null
          npm install "./holywisp-$VERSION.tgz" --no-audit --no-fund
          test "$(node -p "require('holywisp/package.json').version")" = "$VERSION"
          node smoke-package.mjs

      # The whole suite too, with what the tarball carries: its compiled wrapper, its binary and
      # its package.json, so the binary is held to the nightly's version and not only the number.
      - name: The wrapper's tests against the packaged binary
        run: |
          set -eu
          tar -xzf "holywisp-$VERSION.tgz"
          cp -r package/dist package/bin node/
          cp package/package.json node/package.json
          cd node
          node --test --test-timeout=30000 tests/*.test.mjs

  publish:
    name: npm publish holywisp@nightly
    needs: [gate, pack, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: npm with trusted publishing
        run: npm install --global npm@11.13.0 && npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: holywisp-nightly

      - name: Publish
        run: |
          set -euo pipefail
          npm publish "holywisp-$VERSION.tgz" --tag nightly --provenance --access public
          echo "::notice::published holywisp@$VERSION"
