name: "clang-format Code Quality Assurance"

# Modelled on Fracital's Biome workflow: pushes to main get an auto-fix commit from the bot,
# pull requests only get a failing check (a PR runs untrusted code, so a contents:write token
# must never write back to it). Everyone else runs `make format` before pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v5"

      # Pinned on purpose, from PyPI rather than apt so the exact version is a choice and not
      # whatever the runner image ships: a different clang-format formats slightly differently
      # than the one contributors run, and the bot would then find phantom drift on every push.
      # Bump CLANG_FORMAT_VERSION together with the version everyone runs locally.
      - name: "Install clang-format"
        env:
          CLANG_FORMAT_VERSION: "22.1.8"
        run: |
          pipx install "clang-format==$CLANG_FORMAT_VERSION"
          clang-format --version

      - name: "Format with clang-format"
        run: "make format"

      - name: "Check for Git changes"
        id: "verify-changed-files"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Push events on main: the bot commits the fix. No trailers: STYLE.md "Git".
      - name: "Commit and push (main pushes only)"
        if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: auto-fix formatting with clang-format"
          git push

      - name: "Fail if formatting was needed"
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Formatting differs from main. Run 'make format' and push again."
          else
            echo "clang-format changes were needed; committed and pushed. Pull the latest changes."
          fi
          exit 1
