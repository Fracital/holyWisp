name: "clang-format Code Quality Assurance"

# Modelled on Fracital's Biome workflow: pushes to master get an auto-fix commit from the bot,
# pull requests only get a failing check. Everyone else runs `make format` before pushing.
#
# These are two jobs because they are trusted differently. A pull request runs its own Makefile,
# so the job that checks one has a read-only token and does not leave even that in the checkout
# (`persist-credentials: false`): there is nothing in it for the PR's code to push with. Only the
# job for a push to master, whose Makefile is already on master, may write, and it is the only
# place in this file that asks for `contents: write`. A manual dispatch is a check, like a pull
# request: it never commits.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  # Keeps the name the one job of this workflow always had, so a branch protection rule that
  # requires the "quality" check on pull requests still finds it.
  quality:
    if: github.event_name != 'push'
    runs-on: "ubuntu-latest"

    permissions:
      contents: "read"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5.1.0
        with:
          persist-credentials: false

      # Pinned on purpose, from PyPI rather than apt so the exact version is a choice and not
      # whatever the runner image ships: a different clang-format formats slightly differently
      # than the one contributors run, and the bot would then find phantom drift on every push.
      # Bump CLANG_FORMAT_VERSION together with the version everyone runs locally, here and in
      # the `fix` job below.
      - name: "Install clang-format"
        env:
          CLANG_FORMAT_VERSION: "22.1.8"
        run: |
          pipx install "clang-format==$CLANG_FORMAT_VERSION"
          clang-format --version

      - name: "Format with clang-format"
        run: "make format"

      - name: "Fail if formatting was needed"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff --stat
            echo "Formatting differs from master. Run 'make format' and push again."
            exit 1
          fi

  fix:
    name: "Auto-fix formatting on master"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"

    steps:
      # The credentials stay in the checkout here: `git push` below needs them.
      - name: "Checkout code"
        uses: "actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09" # v5.1.0

      # The same version as the `quality` job above.
      - name: "Install clang-format"
        env:
          CLANG_FORMAT_VERSION: "22.1.8"
        run: |
          pipx install "clang-format==$CLANG_FORMAT_VERSION"
          clang-format --version

      - name: "Format with clang-format"
        run: "make format"

      - name: "Check for Git changes"
        id: "verify-changed-files"
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git --no-pager diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # The bot commits the fix. No trailers: STYLE.md "Git".
      - name: "Commit and push"
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "chore: auto-fix formatting with clang-format"
          git push

      - name: "Fail if formatting was needed"
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "clang-format changes were needed; committed and pushed. Pull the latest changes."
          exit 1
