name: Build

# Build and test on every push and PR: GCC and Clang, Debug (ASan + UBSan) and Release, plus
# clang-tidy over the Debug compile database. Formatting is format.yml's job.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.cc }} / ${{ matrix.build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build: [debug, release]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build

      - name: Build
        run: make ${{ matrix.build == 'debug' && 'build' || 'release' }}

      - name: Test
        run: make ${{ matrix.build == 'debug' && 'test' || 'test-release' }}

      - name: Smoke the binaries
        run: |
          set -euo pipefail
          dir=build/${{ matrix.build }}
          "$dir/holywisp" --version
          "$dir/holywisp-client" --help

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same version as .clang-tidy was written against; an older one rejects unknown check names.
      - name: Install toolchain
        env:
          CLANG_TIDY_VERSION: "22.1.8"
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build
          pipx install "clang-tidy==$CLANG_TIDY_VERSION"
          clang-tidy --version

      - name: Configure (compile database)
        run: make build/debug/CMakeCache.txt CC=clang

      - name: clang-tidy
        run: make tidy
