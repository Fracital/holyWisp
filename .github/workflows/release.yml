name: Release

# Binaries as public GitHub release assets (CI artifacts need a GitHub login):
#   push to master, dispatch   -> rolling prerelease `latest`, assets replaced
#   push of a tag v*         -> release <tag>, kept
# Assets: holywisp-<platform>.tar.gz for linux-x64 and linux-arm64 (ubuntu-22.04 runners, so the
# binaries run on glibc 2.35+: Ubuntu 22.04, Debian 12, Fedora 36 and newer), each archive flat
# (holywisp, holywisp-client, README, LICENSE-less by design), the .deb and .rpm built in their
# native containers (deploy/package.sh: hardened unit, dedicated `wisp` user), the npm package
# holywisp-<version>.tgz (node/: the Node.js wrapper with a binary for Linux, macOS and Windows,
# installable with `npm install <url>`), plus SHA256SUMS over all of them. A tag v<version> also
# publishes that tarball to the npm registry (the `npm-publish` job). The stable URL
#   https://github.com/<owner>/<repo>/releases/download/latest/holywisp-linux-x64.tar.gz
# always points at the newest master build. `latest` only moves forward: a run for a commit that is
# an ancestor of the published one builds but does not publish.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      describe: ${{ steps.meta.outputs.describe }}
      commit12: ${{ steps.meta.outputs.commit12 }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version metadata
        id: meta
        run: |
          set -euo pipefail
          echo "describe=$(git describe --tags --always --dirty)" | tee -a "$GITHUB_OUTPUT"
          echo "commit12=${GITHUB_SHA:0:12}" | tee -a "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_OUTPUT"

      - name: Release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"; else tag=latest; fi
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libcrypt-dev

      - name: Build (Release)
        env:
          HW_DESCRIBE: ${{ needs.meta.outputs.describe }}
        run: make release CMAKE_FLAGS="-DHW_BUILD_TESTS=OFF -DHW_VERSION_SUFFIX=+${{ needs.meta.outputs.commit12 }}"

      - name: Smoke test
        run: |
          set -euo pipefail
          build/release/holywisp --version
          build/release/holywisp-client --help > /dev/null
          ldd build/release/holywisp

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          stage="out/holywisp-$PLATFORM"
          mkdir -p "$stage"
          cp build/release/holywisp build/release/holywisp-client README.md "$stage/"
          cp holywisp.conf.example "$stage/holywisp.conf"
          tar -C out -czf "out/holywisp-$PLATFORM.tar.gz" "holywisp-$PLATFORM"
          rm -r "$stage"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: holywisp-${{ matrix.platform }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:12
    defaults:
      run:
        shell: bash # debian:12's /bin/sh is dash, which lacks `set -o pipefail`
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build libcrypt-dev dpkg-dev fakeroot git
      - name: Build .deb
        run: HW_VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}")" bash deploy/package.sh deb
      - name: Install and smoke test the package
        run: |
          set -euo pipefail
          apt-get install -y ./build/packages/holywisp_*.deb
          command -v holywisp
          holywisp --version
          # The isolated user exists and cannot log in.
          getent passwd wisp
          test "$(getent passwd wisp | cut -d: -f7)" = /usr/sbin/nologin
          # The config is not world-readable.
          test "$(stat -c '%a' /etc/holywisp/holywisp.conf)" = 640
      - uses: actions/upload-artifact@v4
        with:
          name: holywisp-deb
          path: build/packages/*.deb
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Fedora package
    runs-on: ubuntu-latest
    container: fedora:41
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: dnf install -y gcc cmake ninja-build libxcrypt-devel rpm-build systemd-rpm-macros git
      - name: Build .rpm
        run: HW_VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && echo "${GITHUB_REF_NAME#v}")" bash deploy/package.sh rpm
      - name: Install and smoke test the package
        run: |
          set -euo pipefail
          dnf install -y ./build/packages/rpmbuild/RPMS/*/holywisp-*.rpm
          holywisp --version
          getent passwd wisp
          # The unit is well-formed and heavily sandboxed.
          systemd-analyze verify /usr/lib/systemd/system/holywisp.service || true
      - name: Collect rpm
        run: |
          mkdir -p out
          cp build/packages/rpmbuild/RPMS/*/holywisp-*.rpm out/
      - uses: actions/upload-artifact@v4
        with:
          name: holywisp-rpm
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 7

  npm:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install toolchain
        env:
          ZIG_VERSION: "0.17.1"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          pipx install "ziglang==$ZIG_VERSION"
      - name: Build and pack
        run: |
          set -euo pipefail
          make npm
          cd node && npm pack
      - name: Install and smoke test the package
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cp node/scripts/smoke-package.mjs node/holywisp-*.tgz "$dir/"
          cd "$dir"
          npm init -y > /dev/null
          npm install ./holywisp-*.tgz --no-audit --no-fund
          node smoke-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: holywisp-npm
          path: node/holywisp-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ needs.meta.outputs.tag }}
    needs: [meta, build, deb, rpm, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd assets
          sha256sum *.tar.gz *.deb *.rpm *.tgz | tee SHA256SUMS

      # `latest` only moves forward. If the published commit is a descendant of this one (a
      # slower run of an older push), keep what is there.
      - name: Skip stale run
        id: stale
        run: |
          set -euo pipefail
          stale=false
          if [ "$TAG" = latest ]; then
            published=$(gh release view latest --json body -q .body 2>/dev/null | sed -n 's/.*<!-- hw-build commit=\([0-9a-f]*\).*/\1/p' || true)
            if [ -n "$published" ] && git cat-file -e "$published^{commit}" 2>/dev/null && \
               [ "$published" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$published"; then
              stale=true
            fi
          fi
          echo "stale=$stale" | tee -a "$GITHUB_OUTPUT"

      - name: Create or update release
        if: steps.stale.outputs.stale != 'true'
        env:
          DESCRIBE: ${{ needs.meta.outputs.describe }}
          BUILD_TIME: ${{ needs.meta.outputs.build_time }}
        run: |
          set -euo pipefail
          notes=$(cat <<NOTES
          holyWisp \`$DESCRIBE\` built $BUILD_TIME from $GITHUB_SHA.

          | Asset | For |
          | --- | --- |
          | \`holywisp-linux-x64.tar.gz\` | x86_64 Linux, glibc 2.35+ |
          | \`holywisp-linux-arm64.tar.gz\` | aarch64 Linux, glibc 2.35+ |
          | \`holywisp_<version>_amd64.deb\` | Debian 12+ / Ubuntu 22.04+: hardened systemd unit, \`wisp\` user |
          | \`holywisp-<version>.fc41.x86_64.rpm\` | Fedora 41+: the same |
          | \`holywisp-<version>.tgz\` | Node.js 20+ on Linux (x64/arm64, glibc or musl), macOS 13+ and Windows 10+ (x64/arm64): \`npm install <asset url>\` |
          | \`SHA256SUMS\` | checksums of the above |

          \`\`\`sh
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/holywisp-linux-x64.tar.gz | tar xz
          cd holywisp-linux-x64 && ./holywisp --config holywisp.conf
          \`\`\`

          <!-- hw-build commit=$GITHUB_SHA describe=$DESCRIBE time=$BUILD_TIME -->
          NOTES
          )
          if [ "$TAG" = latest ]; then
            if gh release view latest > /dev/null 2>&1; then
              gh release edit latest --prerelease --title "latest (master, $DESCRIBE)" --notes "$notes" --target "$GITHUB_SHA"
              # Move the tag so the release points at this commit.
              git tag -f latest "$GITHUB_SHA"
              git push -f origin latest
            else
              gh release create latest --prerelease --title "latest (master, $DESCRIBE)" --notes "$notes" --target "$GITHUB_SHA"
            fi
            gh release upload latest assets/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --notes "$notes" --verify-tag assets/*
          fi

  # `npm publish`, for a tag only, of the very tarball the release carries (built and smoke-tested
  # by the `npm` job above). Authentication is npm's trusted publishing: the registry accepts this
  # workflow's OIDC identity once the package names this repository and `release.yml` as its
  # publisher (npmjs.com -> package -> Settings -> Trusted publisher), so no token is stored. A
  # package has to exist before it can have settings, so its first version needs a token: set the
  # NPM_TOKEN secret for that one release (it is used when present) and delete it afterwards.
  npm-publish:
    name: npm publish ${{ needs.meta.outputs.tag }}
    if: github.ref_type == 'tag'
    needs: [meta, npm, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: npm with trusted publishing
        run: npm install --global npm@11 && npm --version

      - uses: actions/download-artifact@v4
        with:
          name: holywisp-npm

      - name: Publish
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          tarball="holywisp-$version.tgz"
          # The tag names a version; the package must be that version (node/package.json, which
          # the wrapper's tests hold equal to the server's own).
          if [ ! -f "$tarball" ]; then
            echo "::error::tag $TAG, but the package built is $(ls holywisp-*.tgz)"
            exit 1
          fi
          if npm view "holywisp@$version" version > /dev/null 2>&1; then
            echo "holywisp@$version is already on the registry; nothing to publish"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish "$tarball" --access public
