<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>holyWisp</title>
		<!--
  Single-file browser client for a Wisp server. No build step, no bundled assets: the Holo Web
  theme (github.com/zmyaro/holo-web) is pulled from a pinned jsDelivr CDN, Roboto Mono for the
  response and log from Google Fonts (Holo already loads Roboto from there; offline, both fall back
  to the system stacks below), and the only local code is the WispClient class below. Laid out like
  an Android settings screen, Holo dark.
  Set the Wisp server field to a local ws:// server or an external wss:// domain. With UDP on, the
  page reads that relay's /webtransport.json and races WebTransport (Wisp over HTTP/3, on QUIC over
  UDP) against a WebSocket, and remembers the winner per relay; off, it uses the WebSocket alone.
-->
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/zmyaro/holo-web@a20e0f843181c77970208b2695829a0b948c7a4c/holo-base-elements.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/zmyaro/holo-web@a20e0f843181c77970208b2695829a0b948c7a4c/holo-base-widgets.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/zmyaro/holo-web@a20e0f843181c77970208b2695829a0b948c7a4c/holo-ics-dark-elements.css"
		/>
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/gh/zmyaro/holo-web@a20e0f843181c77970208b2695829a0b948c7a4c/holo-ics-dark-widgets.css"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
		/>
		<style>
			/* Holo (pinned above) styles buttons, checkboxes, the list and the action bar. It has no
			   text field or text area, so those are drawn here the way Holo draws its own fields:
			   transparent, with the select's underline, blue when focused. Every colour below is
			   one of Holo dark's: #33B5E5 (ICS blue), the divider rgba(255, 255, 255, 0.15), the
			   underline rgba(204, 204, 204, 0.37), #99CC00 and #FF4444. */
			:root {
				--sans:
					Roboto, ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
					'Helvetica Neue', Arial, sans-serif;
				--mono:
					'Roboto Mono', ui-monospace, 'SF Mono', 'Cascadia Code',
					'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
				--blue: #33b5e5;
				--divider: rgba(255, 255, 255, 0.15);
				--underline: rgba(204, 204, 204, 0.37);
				--secondary: rgba(255, 255, 255, 0.6);
				color-scheme: dark; /* native scrollbars and resize handles to match */
			}
			/* Hiding the log can drop the scrollbar; keep its gutter so the centred column (and
			   the row under the pointer) does not shift sideways on a toggle. */
			html {
				scrollbar-gutter: stable;
			}
			body {
				margin: 0;
				font-family: var(--sans);
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
				text-rendering: optimizeLegibility;
			}
			/* Form controls take the UA's small system font unless told otherwise. */
			input,
			textarea,
			select {
				font: inherit;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			.wrap {
				max-width: 720px;
				margin: 0 auto;
			}

			/* Section headers: Holo's preference category, blue caps over a rule. */
			h2 {
				margin: 24px 0 0;
				padding: 0 16px 6px;
				border-bottom: 2px solid var(--blue);
				color: var(--blue);
				font-size: 13px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}
			h2 .count {
				color: var(--secondary);
				font-weight: 400;
				letter-spacing: 0;
				text-transform: none;
			}
			h2 + .holo-list > li:first-child {
				border-top-width: 0;
			}

			/* Every row, field or toggle, has a title and a summary in the same type. */
			.holo-list li .title {
				display: block;
				font-size: 16px;
			}
			.holo-list li .summary {
				display: block;
				margin-top: 2px;
				color: var(--secondary);
				font-size: 12px;
			}
			.holo-list li .summary code {
				font-family: var(--mono);
				font-size: 11.5px;
			}

			/* A toggle row is one <label>: a click anywhere on it is a click on its checkbox,
			   through the browser's own label activation, so the control's change listener runs
			   once and the keyboard still works on the checkbox itself. Pressed and focused are
			   Holo's list colours. */
			.holo-list li.row {
				padding: 0;
			}
			.holo-list li.row > label {
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 16px;
				cursor: pointer;
				-webkit-user-select: none;
				user-select: none;
				-webkit-tap-highlight-color: transparent;
				transition: background-color 0.12s ease;
			}
			.holo-list li.row input[type='checkbox'] {
				margin: 0 4px 0 0;
				cursor: pointer;
			}
			@media (hover: hover) {
				.holo-list li.row > label:hover {
					background-color: rgba(255, 255, 255, 0.04);
				}
			}
			.holo-list li.row > label:has(input:focus-visible) {
				background-color: rgba(51, 181, 229, 0.31);
			}
			.holo-list li.row > label:active {
				background-color: rgba(51, 181, 229, 0.6);
			}
			.holo-list li.row .grow {
				flex: 1;
				min-width: 0;
			}

			/* Text fields: Holo's field, an underline that turns blue and thicker on focus. */
			.holo-list li input[type='text'] {
				display: block;
				width: 100%;
				box-sizing: border-box;
				margin: 6px 0 6px;
				padding: 6px 0 5px;
				background: transparent;
				color: inherit;
				border: 0;
				border-bottom: 1px solid var(--underline);
				border-radius: 0;
				outline: none;
				font-size: 15px;
				line-height: 1.4;
				cursor: text;
			}
			.holo-list li input[type='text']:focus {
				padding-bottom: 4px;
				border-bottom: 2px solid var(--blue);
			}

			/* Buttons are Holo's; the bar only lines them up with the rows' left edge. */
			.bar {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
				align-items: center;
				padding: 16px 16px 12px;
			}
			.bar button {
				margin: 0;
			}
			.status {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 16px;
				padding: 0 16px 4px;
				color: var(--secondary);
				font-family: var(--mono);
				font-size: 12px;
			}
			.status b {
				color: #fff;
				font-weight: 500;
			}
			.dot {
				display: inline-block;
				width: 9px;
				height: 9px;
				margin-right: 6px;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.3);
				vertical-align: middle;
			}
			.dot.busy {
				background: var(--blue);
			}
			.dot.on {
				background: #99cc00;
			}
			.dot.err {
				background: #ff4444;
			}

			/* Output: read-only panels edged like the list, focus as the fields. */
			textarea {
				display: block;
				width: calc(100% - 32px);
				box-sizing: border-box;
				min-height: 140px;
				margin: 12px 16px 0;
				padding: 8px 10px;
				background: rgba(255, 255, 255, 0.04);
				color: inherit;
				border: 1px solid var(--divider);
				border-radius: 1px;
				outline: none;
				font-family: var(--mono);
				font-size: 12.5px;
				line-height: 1.55;
				white-space: pre-wrap;
				word-break: break-word;
			}
			textarea:focus {
				border-color: rgba(51, 181, 229, 0.6);
			}
			textarea::placeholder,
			input::placeholder {
				color: rgba(255, 255, 255, 0.35);
			}
			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<header class="holo-actionBar">
			<span class="holo-title">holyWisp</span>
			<!-- A direct <button> child of the action bar gets Holo's full-navbar-height styling. -->
			<button
				style="float: right"
				onclick="
					window.open(
						'https://github.com/Fracital/holyWisp',
						'_blank',
						'noopener',
					)
				"
			>
				GitHub
			</button>
		</header>

		<div class="wrap">
			<h2>Connection</h2>
			<ul class="holo-list">
				<li>
					<label class="title" for="wisp">Wisp server</label>
					<input
						id="wisp"
						type="text"
						value="ws://127.0.0.1:6001/"
						spellcheck="false"
						autocomplete="off"
					/>
					<span class="summary"
						>Local <code>ws://127.0.0.1:6001/</code>, external
						<code>wss://wisp.example.com/</code></span
					>
				</li>
				<li>
					<label class="title" for="target">Target URL</label>
					<input
						id="target"
						type="text"
						value="http://api.ipify.org/"
						spellcheck="false"
						autocomplete="off"
					/>
					<span class="summary"
						>The server relays a plain GET to this host and port.</span
					>
				</li>
			</ul>

			<h2>Options</h2>
			<ul class="holo-list">
				<li class="row">
					<label>
						<span class="grow">
							<span class="title">UDP</span>
							<span class="summary"
								>Carry Wisp over WebTransport (QUIC), falling back to a
								WebSocket</span
							>
						</span>
						<input id="udp" type="checkbox" checked />
					</label>
				</li>
				<li class="row">
					<label>
						<span class="grow">
							<span class="title">Wisp v2</span>
							<span class="summary"
								>Negotiate v2: INFO, extensions, stream confirmation</span
							>
						</span>
						<input id="v2" type="checkbox" checked />
					</label>
				</li>
				<li class="row">
					<label>
						<span class="grow">
							<span class="title">Protocol log</span>
							<span class="summary">Show the per-packet trace</span>
						</span>
						<input id="showlog" type="checkbox" checked />
					</label>
				</li>
			</ul>

			<div class="bar">
				<button id="go">Connect</button>
				<button id="stop" disabled>Disconnect</button>
				<button id="clear">Clear</button>
			</div>
			<div class="status">
				<span><span id="dot" class="dot"></span><b id="state">idle</b></span>
				<span>transport <b id="tr">-</b></span>
				<span>version <b id="ver">-</b></span>
				<span>window <b id="win">-</b></span>
				<span>bytes in/out <b id="bytes">0 / 0</b></span>
			</div>

			<h2>Response <span id="respcount" class="count"></span></h2>
			<textarea
				id="resp"
				readonly
				placeholder="The destination's HTTP response appears here."
			></textarea>

			<div id="logcard">
				<h2>Protocol log</h2>
				<textarea
					id="log"
					readonly
					placeholder="Every Wisp packet sent and received is traced here."
				></textarea>
			</div>
		</div>

		<script>
			'use strict';

			// Wisp packet: [type u8][streamId u32 LE][payload].
			const PKT = {
				CONNECT: 0x01,
				DATA: 0x02,
				CONTINUE: 0x03,
				CLOSE: 0x04,
				INFO: 0x05,
			};
			const STREAM_TCP = 0x01;
			// Wisp v2 extensions (INFO: id u8, length u32 LE, metadata).
			const EXT = { PASSWORD: 0x02, MOTD: 0x04, STREAM_CONFIRM: 0x05 };
			const CLOSE_REASONS = {
				0x01: 'unknown',
				0x02: 'voluntary (remote closed)',
				0x03: 'network error',
				0x04: 'incompatible extensions',
				0x41: 'invalid info',
				0x42: 'unreachable host',
				0x43: 'no response',
				0x44: 'connection refused',
				0x47: 'transfer timeout',
				0x48: 'host blocked by policy',
				0x49: 'throttled',
				0x81: 'client error',
				0xc0: 'bad password',
				0xc1: 'bad signature',
				0xc2: 'authentication required',
			};
			const typeName = (t) =>
				({ 1: 'CONNECT', 2: 'DATA', 3: 'CONTINUE', 4: 'CLOSE', 5: 'INFO' })[
					t
				] || '0x' + t.toString(16);
			const enc = new TextEncoder();
			const dec = new TextDecoder();

			const packet = (type, streamId, payload = new Uint8Array(0)) => {
				const buf = new Uint8Array(5 + payload.length);
				buf[0] = type;
				new DataView(buf.buffer).setUint32(1, streamId, true);
				buf.set(payload, 5);
				return buf;
			};

			// ---- Transports: each carries whole Wisp packets, in order. ------------------------

			// One WebSocket message per packet. Offering any subprotocol is the v2 opt-in.
			class WsTransport {
				constructor(url, v2) {
					this.name = 'websocket';
					this.url = url;
					this.v2 = v2;
				}
				open(onPacket, onClose, onLog) {
					this.ws = this.v2
						? new WebSocket(this.url, 'wisp-v2')
						: new WebSocket(this.url);
					this.ws.binaryType = 'arraybuffer';
					this.ws.onopen = () => onLog('info', 'websocket open');
					this.ws.onmessage = (ev) =>
						onPacket(new Uint8Array(ev.data), 'message');
					this.ws.onerror = () =>
						onLog('err', 'websocket error (is the Wisp server reachable?)');
					this.ws.onclose = (ev) =>
						onClose(`websocket closed (code ${ev.code})`);
				}
				send(buf) {
					if (this.ws && this.ws.readyState === 1) this.ws.send(buf);
				}
				close() {
					if (this.ws && this.ws.readyState <= 1) this.ws.close();
				}
			}

			// The token that asks the server to open the Wisp stream itself (docs/webtransport.md,
			// "Lanes and the server-opened stream"). Offered only where the browser says which token
			// the server answered, which is how the page knows whose stream to use.
			const WT_SERVER_STREAM = 'wisp-v2-server-stream';
			const WT_SERVER_STREAM_OK =
				typeof WebTransport !== 'undefined' &&
				'protocol' in WebTransport.prototype;

			// One bidirectional stream of packets, each behind a u32 LE length.
			class WtTransport {
				constructor(cfg, v2) {
					this.name = 'webtransport';
					this.cfg = cfg; // the relay's /webtransport.json
					this.v2 = v2;
					this.closed = false;
				}
				open(onPacket, onClose, onLog) {
					const opts = {};
					const hashes = this.cfg.hashes || [];
					if (hashes.length) {
						opts.serverCertificateHashes = hashes.map((h) => ({
							algorithm: h.algorithm,
							value: Uint8Array.from(atob(h.value), (c) => c.charCodeAt(0)),
						}));
					}
					// With v2, a browser that reports the answer (wt.protocol) also offers the
					// server-opened stream: a server that knows it opens the Wisp stream itself and
					// sends INFO and its CONTINUE at once, one round trip sooner. An older server
					// echoes the first token, wisp-v2, and the page opens the stream as before.
					if (this.v2)
						opts.protocols = WT_SERVER_STREAM_OK
							? ['wisp-v2', WT_SERVER_STREAM]
							: ['wisp-v2'];
					const end = (why) => {
						if (this.closed) return;
						this.closed = true;
						onClose(why);
					};
					onLog(
						'info',
						`webtransport to ${this.cfg.url} (${hashes.length ? `pinned to ${hashes.length} certificate hash${hashes.length > 1 ? 'es' : ''}` : 'Web PKI certificate'})`,
					);
					try {
						this.wt = new WebTransport(this.cfg.url, opts);
					} catch (e) {
						setTimeout(() => end(`webtransport refused: ${e.message}`));
						return;
					}
					this.wt.closed.then(
						(i) => end(`webtransport closed (code ${i.closeCode || 0})`),
						(e) => end(`webtransport failed: ${e.message || e}`),
					);
					(async () => {
						await this.wt.ready;
						const serverOpened = this.wt.protocol === WT_SERVER_STREAM;
						onLog(
							'info',
							`webtransport session ready${serverOpened ? ' (the server opens the Wisp stream)' : ''}`,
						);
						let bidi;
						if (serverOpened) {
							const incoming = this.wt.incomingBidirectionalStreams.getReader();
							const { value, done } = await incoming.read();
							incoming.releaseLock();
							if (done) throw new Error('the server opened no Wisp stream');
							bidi = value;
						} else {
							bidi = await this.wt.createBidirectionalStream();
						}
						this.writer = bidi.writable.getWriter();
						const reader = bidi.readable.getReader();
						// Packets behind a u32 LE length, in a buffer that grows by doubling and is
						// compacted only when the tail runs out of room: each byte is copied a bounded
						// number of times, however many reads a large packet arrives in.
						let buf = new Uint8Array(64 * 1024);
						let head = 0;
						let tail = 0;
						for (;;) {
							const { value, done } = await reader.read();
							if (done) break;
							if (tail + value.length > buf.length) {
								const live = tail - head;
								if (live + value.length > buf.length) {
									let cap = buf.length * 2;
									while (cap < live + value.length) cap *= 2;
									const m = new Uint8Array(cap);
									m.set(buf.subarray(head, tail));
									buf = m;
								} else {
									buf.copyWithin(0, head, tail);
								}
								head = 0;
								tail = live;
							}
							buf.set(value, tail);
							tail += value.length;
							const dv = new DataView(buf.buffer);
							while (tail - head >= 4) {
								const n = dv.getUint32(head, true);
								if (tail - head < 4 + n) break;
								onPacket(buf.slice(head + 4, head + 4 + n), 'stream');
								head += 4 + n;
							}
							if (head === tail) head = tail = 0;
						}
						end('webtransport: the Wisp stream ended');
					})().catch((e) => end(`webtransport failed: ${e.message || e}`));
				}
				send(buf) {
					if (!this.writer) return;
					const f = new Uint8Array(4 + buf.length);
					new DataView(f.buffer).setUint32(0, buf.length, true);
					f.set(buf, 4);
					this.writer.write(f).catch(() => {});
				}
				close() {
					this.closed = true;
					try {
						if (this.wt) this.wt.close({ closeCode: 0, reason: 'bye' });
					} catch {
						// already closed
					}
				}
			}

			// ---- Wisp over either transport. --------------------------------------------------

			class WispClient {
				constructor(
					transport,
					{ v2 = true, onLog, onState, onData, onClose } = {},
				) {
					this.t = transport;
					this.v2 = v2;
					this.onLog = onLog || (() => {});
					this.onState = onState || (() => {});
					this.onData = onData || (() => {});
					this.onClose = onClose || (() => {});
					this.ready = false;
					this.nextId = 1;
					this.sentInfo = false;
					this.server = { version: null, motd: '', password: false };
					this.confirm = false;
				}

				connect() {
					this.onLog(
						'info',
						`connecting over ${this.t.name} (${this.v2 ? 'wisp-v2 offered' : 'wisp-v1'})`,
					);
					this.t.open(
						(buf, via) => this._onPacket(buf, via),
						(why) => {
							this.ready = false;
							this.onLog('info', why);
							this.onState('closed');
						},
						this.onLog,
					);
				}

				close() {
					this.t.close();
				}

				_send(type, streamId, payload) {
					this.t.send(packet(type, streamId, payload));
					this.onLog(
						'tx',
						`${typeName(type)} stream=${streamId} len=${payload ? payload.length : 0}`,
					);
				}

				_parseInfo(payload) {
					const exts = [];
					const dv = new DataView(
						payload.buffer,
						payload.byteOffset,
						payload.byteLength,
					);
					let o = 2;
					while (o + 5 <= payload.length) {
						const id = payload[o];
						const len = dv.getUint32(o + 1, true);
						const meta = payload.subarray(o + 5, o + 5 + len);
						o += 5 + len;
						exts.push(id);
						if (id === EXT.MOTD) this.server.motd = dec.decode(meta);
						if (id === EXT.PASSWORD) this.server.password = !!meta[0];
					}
					return exts;
				}

				_onPacket(buf) {
					if (buf.length < 5) return;
					const type = buf[0];
					const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
					const streamId = dv.getUint32(1, true);
					const payload = buf.subarray(5);
					this.onLog(
						'rx',
						`${typeName(type)} stream=${streamId} len=${payload.length}` +
							(type === PKT.CLOSE
								? ` reason=${CLOSE_REASONS[payload[0]] || payload[0]}`
								: '') +
							(type === PKT.CONTINUE ? ` window=${dv.getUint32(5, true)}` : ''),
					);

					if (type === PKT.INFO && streamId === 0) {
						this.server.version = `${payload[0]}.${payload[1]}`;
						const exts = this._parseInfo(payload);
						const names = exts.map(
							(e) =>
								({
									1: 'udp',
									2: 'password',
									3: 'key',
									4: 'motd',
									5: 'stream-confirm',
								})[e] || '0x' + e.toString(16),
						);
						this.onLog(
							'info',
							`server extensions: ${names.join(', ') || 'none'}`,
						);
						if (this.server.motd)
							this.onLog('info', `motd: ${this.server.motd}`);
						if (this.server.password) {
							this.onLog(
								'err',
								'the server wants a password, and this page has none',
							);
						}
						this.onState('handshaking', {
							ver: `v2 (server ${this.server.version})`,
						});
						if (!this.sentInfo) {
							this.sentInfo = true;
							// Ours: stream confirmation, with empty metadata.
							const p = new Uint8Array([2, 0, EXT.STREAM_CONFIRM, 0, 0, 0, 0]);
							this._send(PKT.INFO, 0, p);
							this.confirm = true;
						}
						return;
					}
					if (type === PKT.CONTINUE && streamId === 0) {
						this.window = dv.getUint32(5, true);
						if (!this.ready) {
							this.ready = true;
							this.onState('ready', {
								ver: this.server.version
									? `v2 (server ${this.server.version})`
									: 'v1',
								window: this.window,
							});
						}
						return;
					}
					if (
						type === PKT.CONTINUE &&
						this.confirm &&
						this.confirmed &&
						!this.confirmed.has(streamId)
					) {
						this.confirmed.add(streamId);
						this.onLog(
							'info',
							`stream ${streamId} connected (stream confirmation)`,
						);
					}
					if (type === PKT.DATA) this.onData(streamId, payload);
					if (type === PKT.CLOSE) this.onClose(streamId, payload[0]);
				}

				openTCP(host, port) {
					const id = this.nextId++;
					const hostBytes = enc.encode(host);
					const payload = new Uint8Array(3 + hostBytes.length);
					payload[0] = STREAM_TCP;
					new DataView(payload.buffer).setUint16(1, port, true);
					payload.set(hostBytes, 3);
					this._send(PKT.CONNECT, id, payload);
					(this.confirmed = this.confirmed || new Set()).delete(id);
					return id;
				}

				sendData(streamId, bytes) {
					this._send(PKT.DATA, streamId, bytes);
				}
			}

			// ---- Picking a transport, as STomp does: with UDP on, WebTransport when the relay has it,
			// raced against a WebSocket; with UDP off, the WebSocket alone. --------------------

			// The relay's /webtransport.json lives at the root of the origin that serves its
			// WebSocket: ws(s)://host/... -> http(s)://host/webtransport.json.
			function wtConfigUrl(wsUrl) {
				const u = new URL(wsUrl);
				if (u.protocol !== 'ws:' && u.protocol !== 'wss:') return null;
				return `${u.protocol === 'wss:' ? 'https:' : 'http:'}//${u.host}/webtransport.json`;
			}

			async function fetchWtConfig(wsUrl, ms) {
				const url = wtConfigUrl(wsUrl);
				if (!url) throw new Error('not a ws:// or wss:// URL');
				const ctl = new AbortController();
				const timer = setTimeout(() => ctl.abort(), ms);
				try {
					const r = await fetch(url, { signal: ctl.signal, cache: 'no-store' });
					if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
					let j;
					try {
						j = await r.json();
					} catch {
						throw new Error(
							`${url}: not JSON (this relay has no WebTransport)`,
						);
					}
					if (!j || typeof j.url !== 'string' || !Array.isArray(j.hashes)) {
						throw new Error(`${url}: not a WebTransport description`);
					}
					// "" is the server's default (no webtransport-url): the same host and port
					// number as the relay, over HTTPS.
					if (j.url === '') j.url = `https://${new URL(wsUrl).host}/`;
					if (!/^https:\/\//.test(j.url))
						throw new Error(`${url}: no https:// url`);
					return j;
				} finally {
					clearTimeout(timer);
				}
			}

			// What won last time, per relay: a WebSocket win keeps WebTransport off for an hour, a
			// WebTransport win gives it a longer head start. Storage may be off: then every connect
			// detects afresh.
			const MEMO_KEY = 'holywisp.transport:';
			const MEMO_WS_MS = 60 * 60 * 1000;
			function memoGet(relay) {
				try {
					return JSON.parse(localStorage.getItem(MEMO_KEY + relay) || 'null');
				} catch {
					return null;
				}
			}
			function memoSet(relay, transport) {
				try {
					localStorage.setItem(
						MEMO_KEY + relay,
						JSON.stringify({ transport, at: Date.now() }),
					);
				} catch {
					// storage is off
				}
			}

			// Resolves to the first WispClient whose handshake finishes (stream-0 CONTINUE); every
			// other attempt is closed. WebTransport is preferred: /webtransport.json is fetched at
			// once, its session starts as soon as that answers, and the WebSocket starts after a head
			// start counted from the beginning (so the fetch never delays it), or as soon as
			// WebTransport turns out not to be there or fails. Rejects when every attempt failed.
			function connectBest(wsUrl, mode, opts, log) {
				const relay = wsUrl;
				const memo = memoGet(relay);
				let tryWt = false;
				if (mode !== 'websocket') {
					if (typeof WebTransport === 'undefined') {
						log('info', 'this browser has no WebTransport');
					} else if (
						memo &&
						memo.transport === 'websocket' &&
						Date.now() - memo.at < MEMO_WS_MS
					) {
						log(
							'info',
							`WebTransport skipped: a WebSocket won here at ${new Date(memo.at).toLocaleTimeString('en-GB', { hour12: false })}`,
						);
					} else {
						tryWt = true;
					}
				}
				return new Promise((resolve, reject) => {
					const attempts = [];
					let winner = null;
					let wtCfg = null;
					let wtPending = tryWt; // the description is still on its way
					let wsTimer = null;
					let wsStarted = false;
					const settle = () => {
						if (winner || wtPending) return;
						if (!attempts.length || !attempts.every((a) => a.dead)) return;
						if (!wsStarted) {
							startWs();
							return;
						}
						reject(new Error('no transport reached the server'));
					};
					const start = (transport) => {
						const a = { kind: transport.name, dead: false };
						const tag = transport.name === 'webtransport' ? 'wt' : 'ws';
						const c = new WispClient(transport, {
							...opts,
							onLog: (k, m) => {
								if (!winner || winner === c) log(k, `[${tag}] ${m}`);
							},
							onState: (s, extra) => {
								if (winner === c) return opts.onState(s, extra);
								if (winner) return;
								if (s === 'closed') {
									a.dead = true;
									if (transport.name === 'webtransport') startWs();
									settle();
									return;
								}
								if (s !== 'ready') return;
								winner = c;
								clearTimeout(wsTimer);
								for (const o of attempts) if (o.client !== c) o.client.close();
								if (wtCfg) memoSet(relay, transport.name);
								log('info', `using ${transport.name}`);
								resolve({ client: c, extra });
							},
							onData: (...args) => winner === c && opts.onData(...args),
							onClose: (...args) => winner === c && opts.onClose(...args),
						});
						a.client = c;
						attempts.push(a);
						c.connect();
					};
					const startWs = () => {
						if (wsStarted || winner) return;
						wsStarted = true;
						clearTimeout(wsTimer);
						start(new WsTransport(wsUrl, opts.v2));
					};
					if (!tryWt) {
						startWs();
						return;
					}
					const head = memo && memo.transport === 'webtransport' ? 3000 : 1000;
					wsTimer = setTimeout(startWs, head);
					fetchWtConfig(wsUrl, 2500).then(
						(cfg) => {
							wtPending = false;
							if (winner) return;
							wtCfg = cfg;
							start(new WtTransport(cfg, opts.v2));
						},
						(e) => {
							wtPending = false;
							log('info', `no WebTransport for this relay (${e.message || e})`);
							startWs();
							settle();
						},
					);
				});
			}

			// ---- The page. ---------------------------------------------------------------------

			const $ = (id) => document.getElementById(id);
			const resp = $('resp');
			const log = $('log');
			let client = null;
			let run = 0;
			let inBytes = 0;
			let outBytes = 0;
			let respBytes = 0;

			function stamp() {
				return (
					new Date().toLocaleTimeString('en-GB', { hour12: false }) +
					'.' +
					String(Date.now() % 1000).padStart(3, '0')
				);
			}

			function logLine(kind, msg) {
				const arrow = { tx: '>', rx: '<', info: '+', err: 'x' }[kind] || ' ';
				log.value += `${stamp()}  ${arrow} ${msg}\n`;
				log.scrollTop = log.scrollHeight;
			}

			function setState(state, extra = {}) {
				$('dot').className =
					'dot' +
					(state === 'ready' || state === 'done'
						? ' on'
						: state === 'error' || state === 'closed'
							? ' err'
							: state === 'idle'
								? ''
								: ' busy');
				$('state').textContent = state;
				if (extra.ver) $('ver').textContent = extra.ver;
				if (extra.window !== undefined) $('win').textContent = extra.window;
			}

			function bump(dIn, dOut) {
				inBytes += dIn;
				outBytes += dOut;
				$('bytes').textContent = `${inBytes} / ${outBytes}`;
			}

			function parseTarget(url) {
				let u;
				try {
					u = new URL(url);
				} catch {
					throw new Error('target is not a valid URL');
				}
				if (u.protocol !== 'http:')
					throw new Error(
						'target must be http:// (the server relays plain HTTP)',
					);
				const port = u.port ? parseInt(u.port, 10) : 80;
				return {
					host: u.hostname,
					port: port,
					path: (u.pathname || '/') + (u.search || ''),
				};
			}

			async function start() {
				stop();
				const me = ++run;
				resp.value = '';
				respBytes = 0;
				$('respcount').textContent = '';
				inBytes = 0;
				outBytes = 0;
				bump(0, 0);
				$('tr').textContent = '-';
				setState('connecting', { ver: '-', window: '-' });

				let target;
				try {
					target = parseTarget($('target').value.trim());
				} catch (e) {
					logLine('err', e.message);
					setState('error');
					return;
				}

				$('go').disabled = true;
				$('stop').disabled = false;
				let tcpId = null;
				const opts = {
					v2: $('v2').checked,
					onState: (s, extra) => setState(s, extra),
					onData: (sid, payload) => {
						if (sid !== tcpId) return;
						bump(payload.length, 0);
						respBytes += payload.length;
						resp.value += dec.decode(payload, { stream: true });
						resp.scrollTop = resp.scrollHeight;
						$('respcount').textContent = `(${respBytes} bytes)`;
					},
					onClose: (sid, reason) => {
						const why = CLOSE_REASONS[reason] || reason;
						if (sid !== tcpId) return;
						logLine('info', `stream ${sid} closed: ${why}`);
						setState('done', {});
						$('go').disabled = false;
						$('stop').disabled = true;
					},
				};
				let got;
				try {
					const mode = $('udp').checked ? 'auto' : 'websocket';
					got = await connectBest($('wisp').value.trim(), mode, opts, logLine);
				} catch (e) {
					if (me !== run) return;
					logLine('err', e.message || String(e));
					setState('error');
					$('go').disabled = false;
					$('stop').disabled = true;
					return;
				}
				if (me !== run) {
					got.client.close();
					return;
				}
				client = got.client;
				$('tr').textContent = client.t.name;
				setState('ready', got.extra);

				tcpId = client.openTCP(target.host, target.port);
				const req =
					`GET ${target.path} HTTP/1.1\r\nHost: ${target.host}\r\n` +
					`User-Agent: holywisp-webclient\r\nAccept: */*\r\nConnection: close\r\n\r\n`;
				const bytes = enc.encode(req);
				client.sendData(tcpId, bytes);
				bump(0, bytes.length);
				logLine(
					'info',
					`sent HTTP request to ${target.host}:${target.port} on stream ${tcpId}`,
				);
			}

			function stop() {
				run++;
				if (client) {
					client.close();
					client = null;
				}
				$('go').disabled = false;
				$('stop').disabled = true;
			}

			$('go').onclick = start;
			$('stop').onclick = () => {
				stop();
				setState('closed');
			};
			$('clear').onclick = () => {
				resp.value = '';
				log.value = '';
				$('respcount').textContent = '';
			};
			$('showlog').onchange = (e) =>
				$('logcard').classList.toggle('hidden', !e.target.checked);

			// The server that served this page is the Wisp server: default to this origin with
			// http->ws. The server can override that through window.HOLYWISP_CONFIG.wisp
			// (webclient-wisp-url) when the relay lives somewhere else. As a local file, keep the
			// ws://127.0.0.1:6001/ default.
			if (location.protocol === 'http:' || location.protocol === 'https:') {
				const cfg = window.HOLYWISP_CONFIG || {};
				$('wisp').value =
					cfg.wisp || `${location.origin.replace(/^http/, 'ws')}/`;
			}
		</script>
	</body>
</html>
