<!--
  Single-file browser client for a Wisp server. No build step, no dependencies.
  Visual style: Holo Web (Android Ice Cream Sandwich theme), inlined below.
  The whole Wisp implementation is the WispClient class, about 120 lines.
  Set the Wisp server field to a local ws:// server or an external wss:// domain.
-->

<body>
<header class="holo-actionBar">
  <span class="holo-title">holyWisp web client</span>
  <button id="theme" class="actions-right" style="float:right;">Light</button>
</header>

<div class="wrap">
  <div class="field">
    <label for="wisp">Wisp server</label>
    <input id="wisp" type="text" value="ws://127.0.0.1:6001/" spellcheck="false" />
    <div class="hint">Local <code>ws://127.0.0.1:6001/</code>, external <code>wss://wisp.example.com/</code></div>
  </div>

  <div class="field">
    <label for="target">Target URL</label>
    <input id="target" type="text" value="http://api.ipify.org/" spellcheck="false" />
    <div class="hint">The server relays a plain GET to this host and port.</div>
  </div>

  <div class="controls">
    <button id="go">Connect</button>
    <button id="stop" disabled>Disconnect</button>
    <button id="clear">Clear</button>
    <label><input id="v2" type="checkbox" /> Wisp v2</label>
    <label><input id="showlog" type="checkbox" checked /> Protocol log</label>
  </div>

  <div class="status">
    <span><span id="dot" class="dot"></span><b id="state">idle</b></span>
    <span>version <b id="ver">-</b></span>
    <span>window <b id="win">-</b></span>
    <span>bytes in/out <b id="bytes">0 / 0</b></span>
  </div>

  <h2>Response <span id="respcount"></span></h2>
  <textarea id="resp" readonly placeholder="The destination HTTP response appears here."></textarea>

  <div id="logcard">
    <h2>Protocol log</h2>
    <textarea id="log" readonly placeholder="Every Wisp packet sent and received is traced here."></textarea>
  </div>
</div>

<script>
"use strict";

// Wisp packet: [type u8][streamId u32 LE][payload].
const PKT = { CONNECT: 0x01, DATA: 0x02, CONTINUE: 0x03, CLOSE: 0x04, INFO: 0x05 };
const STREAM_TCP = 0x01;
const CLOSE_REASONS = {
  0x01: "unknown", 0x02: "voluntary (remote closed)", 0x03: "network error",
  0x04: "incompatible extensions", 0x41: "invalid info", 0x42: "unreachable host",
  0x43: "no response", 0x44: "connection refused", 0x47: "transfer timeout",
  0x48: "host blocked by policy", 0x49: "throttled", 0x81: "client error",
  0xc0: "bad password", 0xc1: "bad signature", 0xc2: "authentication required",
};
const typeName = t => ({ 1: "CONNECT", 2: "DATA", 3: "CONTINUE", 4: "CLOSE", 5: "INFO" }[t] || "0x" + t.toString(16));
const enc = new TextEncoder();
const dec = new TextDecoder();

class WispClient {
  constructor(url, { v2 = false, onLog, onState, onData, onClose } = {}) {
    this.url = url;
    this.v2 = v2;
    this.onLog = onLog || (() => {});
    this.onState = onState || (() => {});
    this.onData = onData || (() => {});
    this.onClose = onClose || (() => {});
    this.ready = false;
    this.nextId = 1;
    this.sentInfo = false;
  }

  connect() {
    this.onLog("info", "connecting to " + this.url + " (" + (this.v2 ? "wisp-v2" : "wisp-v1") + ")");
    this.ws = this.v2 ? new WebSocket(this.url, "wisp-v2") : new WebSocket(this.url);
    this.ws.binaryType = "arraybuffer";
    this.ws.onopen = () => this.onLog("info", "websocket open");
    this.ws.onmessage = ev => this._onFrame(new Uint8Array(ev.data));
    this.ws.onerror = () => this.onLog("err", "websocket error (is the Wisp server reachable?)");
    this.ws.onclose = ev => { this.ready = false; this.onState("closed"); this.onLog("info", "websocket closed (code " + ev.code + ")"); };
  }

  close() { if (this.ws && this.ws.readyState <= 1) this.ws.close(); }

  _send(type, streamId, payload) {
    payload = payload || new Uint8Array(0);
    const buf = new Uint8Array(5 + payload.length);
    const dv = new DataView(buf.buffer);
    buf[0] = type;
    dv.setUint32(1, streamId, true);
    buf.set(payload, 5);
    this.ws.send(buf);
    this.onLog("tx", typeName(type) + " stream=" + streamId + " len=" + payload.length);
  }

  _onFrame(buf) {
    if (buf.length < 5) return;
    const type = buf[0];
    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    const streamId = dv.getUint32(1, true);
    const payload = buf.subarray(5);
    this.onLog("rx", typeName(type) + " stream=" + streamId + " len=" + payload.length
      + (type === PKT.CLOSE ? " reason=" + (CLOSE_REASONS[payload[0]] || payload[0]) : "")
      + (type === PKT.CONTINUE ? " window=" + dv.getUint32(5, true) : ""));

    if (type === PKT.INFO && streamId === 0) {
      const major = payload[0], minor = payload[1];
      this.onState("handshaking", { ver: "v2 (server " + major + "." + minor + ")" });
      if (!this.sentInfo) { this.sentInfo = true; this._send(PKT.INFO, 0, new Uint8Array([2, 1])); }
      return;
    }
    if (type === PKT.CONTINUE && streamId === 0) {
      this.window = dv.getUint32(5, true);
      if (!this.ready) { this.ready = true; this.onState("ready", { ver: this.v2 ? "v2" : "v1", window: this.window }); }
      return;
    }
    if (type === PKT.DATA) this.onData(streamId, payload);
    if (type === PKT.CLOSE) this.onClose(streamId, payload[0]);
  }

  openTCP(host, port) {
    const id = this.nextId++;
    const hostBytes = enc.encode(host);
    const payload = new Uint8Array(3 + hostBytes.length);
    const dv = new DataView(payload.buffer);
    payload[0] = STREAM_TCP;
    dv.setUint16(1, port, true);
    payload.set(hostBytes, 3);
    this._send(PKT.CONNECT, id, payload);
    return id;
  }

  sendData(streamId, bytes) { this._send(PKT.DATA, streamId, bytes); }
}

const $ = id => document.getElementById(id);
const resp = $("resp"), log = $("log");
let client = null, inBytes = 0, outBytes = 0, respBytes = 0;

function stamp() { return new Date().toLocaleTimeString("en-GB", { hour12: false }) + "." + String(Date.now() % 1000).padStart(3, "0"); }
function logLine(kind, msg) {
  const arrow = { tx: ">", rx: "<", info: "+", err: "x" }[kind] || " ";
  log.value += stamp() + "  " + arrow + " " + msg + "\n";
  log.scrollTop = log.scrollHeight;
}
function setState(state, extra) {
  extra = extra || {};
  $("dot").className = "dot" + (state === "ready" ? " on" : (state === "error" || state === "closed") ? " err" : "");
  $("state").textContent = state;
  if (extra.ver) $("ver").textContent = extra.ver;
  if (extra.window !== undefined) $("win").textContent = extra.window;
}
function bump(dIn, dOut) { inBytes += dIn; outBytes += dOut; $("bytes").textContent = inBytes + " / " + outBytes; }

function parseTarget(url) {
  let u;
  try { u = new URL(url); } catch (e) { throw new Error("target is not a valid URL"); }
  if (u.protocol !== "http:") throw new Error("target must be http:// (the server relays plain HTTP)");
  const port = u.port ? parseInt(u.port, 10) : 80;
  return { host: u.hostname, port: port, path: (u.pathname || "/") + (u.search || "") };
}

function start() {
  stop();
  resp.value = ""; respBytes = 0; $("respcount").textContent = "";
  inBytes = outBytes = 0; bump(0, 0);
  setState("connecting", { ver: "-", window: "-" });

  let target;
  try { target = parseTarget($("target").value.trim()); }
  catch (e) { logLine("err", e.message); setState("error"); return; }

  $("go").disabled = true; $("stop").disabled = false;
  let streamId = null;
  client = new WispClient($("wisp").value.trim(), {
    v2: $("v2").checked,
    onLog: logLine,
    onState: (s, extra) => {
      setState(s, extra);
      if (s === "ready" && streamId === null) {
        streamId = client.openTCP(target.host, target.port);
        const req = "GET " + target.path + " HTTP/1.1\r\nHost: " + target.host + "\r\nUser-Agent: holywisp-webclient\r\nAccept: */*\r\nConnection: close\r\n\r\n";
        const bytes = enc.encode(req);
        client.sendData(streamId, bytes);
        bump(0, bytes.length);
        logLine("info", "sent HTTP request to " + target.host + ":" + target.port + " on stream " + streamId);
      }
    },
    onData: (sid, payload) => {
      if (sid !== streamId) return;
      bump(payload.length, 0);
      respBytes += payload.length;
      resp.value += dec.decode(payload, { stream: true });
      resp.scrollTop = resp.scrollHeight;
      $("respcount").textContent = "(" + respBytes + " bytes)";
    },
    onClose: (sid, reason) => {
      if (sid !== streamId) return;
      logLine("info", "stream " + sid + " closed: " + (CLOSE_REASONS[reason] || reason));
      setState("done", {});
      $("go").disabled = false; $("stop").disabled = true;
    },
  });
  client.connect();
}

function stop() {
  if (client) { client.close(); client = null; }
  $("go").disabled = false; $("stop").disabled = true;
}

$("go").onclick = start;
$("stop").onclick = () => { stop(); setState("closed"); };
$("clear").onclick = () => { resp.value = ""; log.value = ""; $("respcount").textContent = ""; };
$("showlog").onchange = e => $("logcard").classList.toggle("hidden", !e.target.checked);

function setTheme(t) {
  $("holo-dark").disabled = (t !== "dark");
  $("holo-light").disabled = (t !== "light");
  $("theme").textContent = (t === "dark") ? "Light" : "Dark";
  try { localStorage.setItem("hw-theme", t); } catch (e) {}
}
$("theme").onclick = () => setTheme($("holo-dark").disabled ? "dark" : "light");
let theme0 = "dark";
try { theme0 = localStorage.getItem("hw-theme") || "dark"; } catch (e) {}
setTheme(theme0);

// Served by the Wisp server itself: default the Wisp field to this same origin. As a local file,
// keep the ws://127.0.0.1:6001/ default.
if (location.protocol === "http:" || location.protocol === "https:") {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  $("wisp").value = scheme + "://" + location.host + "/";
}
</script>
</body>
</html>
